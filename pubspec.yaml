name: bookly
description: "Bookly: encuentra, compara y reserva servicios de belleza y bienestar."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # Firebase: inicio de sesión con Google y base de datos en la nube
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  # Elegir fotos de la galería para productos y publicaciones
  image_picker: ^1.2.0
  # Enviar los correos de aviso por medio de EmailJS
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
